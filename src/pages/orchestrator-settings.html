<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Display Orchestrator Settings</title>
    <style>
      :root { font-family: Segoe UI, Helvetica Neue, sans-serif; }
      body { margin: 1.5rem; background: #0b132b; color: #f4f7fb; }
      main { max-width: 900px; margin: 0 auto; }
      section { margin: 1rem 0; padding: 1rem; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: rgba(255,255,255,0.06); }
      .row { display: flex; gap: 1rem; flex-wrap: wrap; }
      label { display: block; margin: 0.5rem 0; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9rem; }
      button { margin-right: 0.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Display Orchestrator Settings</h1>

      <section>
        <h2>Enabled Pages</h2>
        <label><input id="pageHallway" type="checkbox" value="hallway" /> hallway</label>
        <label><input id="pageWeather" type="checkbox" value="weather" /> weather</label>
        <label><input id="pageTime" type="checkbox" value="time" /> time</label>
      </section>

      <section>
        <h2>Rotation Controls</h2>
        <label>
          Rotation Interval
          <input id="rotationIntervalMs" type="range" min="5000" max="120000" step="1000" />
          <span id="rotation-value" class="mono"></span>
        </label>
        <label>
          Rotation Mode
          <select id="rotationMode">
            <option value="time">time</option>
            <option value="schedule">schedule</option>
            <option value="weather">weather</option>
            <option value="phase">phase</option>
          </select>
        </label>
      </section>

      <section>
        <h2>Weather Triggers</h2>
        <label><input id="weatherSevere" type="checkbox" /> severeWeather</label>
        <label>tempThreshold <input id="weatherTempThreshold" type="number" min="-50" max="140" /></label>
      </section>

      <section>
        <h2>Schedule Triggers</h2>
        <label><input id="scheduleClassChange" type="checkbox" /> classChange</label>
        <label><input id="schedulePassingPeriod" type="checkbox" /> passingPeriod</label>
      </section>

      <section>
        <h2>Phase Triggers</h2>
        <label><input id="phaseChapel" type="checkbox" /> chapel</label>
        <label><input id="phaseAssembly" type="checkbox" /> assembly</label>
        <label><input id="phaseEmergency" type="checkbox" /> emergency</label>
      </section>

      <section>
        <h2>Add Page</h2>
        <label>Page Name <input id="newPageName" type="text" /></label>
        <label>
          Page Type
          <select id="newPageType">
            <option value="url">url</option>
            <option value="inline-code">inline-code</option>
          </select>
        </label>
        <label>URL <input id="newPageUrl" type="url" placeholder="https://example.com/page" /></label>
        <label>Inline Code (HTML)
          <textarea id="newPageCode" rows="8" class="mono" placeholder="<section><h1>Custom Page</h1></section>"></textarea>
        </label>
        <button id="savePage" type="button">Save Page</button>
      </section>

      <section>
        <h2>Actions</h2>
        <button id="saveSettings" type="button">Save Settings</button>
        <button id="refreshSettings" type="button">Refresh</button>
        <button id="downloadSettings" type="button">Download Settings</button>
        <button id="backupPages" type="button">Backup Pages</button>
        <input id="restoreSettingsFile" type="file" accept="application/json" />
        <button id="restoreSettings" type="button">Restore Settings</button>
      </section>

      <section>
        <h2>Live Rotation Preview</h2>
        <pre id="rotationPreview" class="mono">loading...</pre>
      </section>

      <section>
        <h2>Status</h2>
        <pre id="status" class="mono"></pre>
      </section>
    </main>
    <script type="module" src="./scripts/orchestrator-settings.js"></script>
  </body>
</html>
