<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Display Orchestrator Settings</title>
    <style>
      :root { font-family: Segoe UI, Helvetica Neue, sans-serif; }
      body { margin: 1.5rem; background: #0b132b; color: #f4f7fb; }
      main { max-width: 1000px; margin: 0 auto; }
      section { margin: 1rem 0; padding: 1rem; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: rgba(255,255,255,0.06); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9rem; }
      .page-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
      .page-card { border: 1px solid rgba(255,255,255,0.22); border-radius: 8px; padding: 10px; background: rgba(0,0,0,0.15); }
      .row { display: flex; gap: 10px; align-items: center; margin: 6px 0; }
      .row label { flex: 1; }
      select, input[type="text"], input[type="url"], textarea, input[type="number"] { width: 100%; }
      .time-settings { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.2); }
      button { margin-right: 0.5rem; margin-top: 8px; }
      .preview-card { line-height: 1.5; }
      .preview-highlight { color: #ffd166; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Display Orchestrator Settings</h1>

      <section>
        <h2>Display Registry</h2>
        <div class="row">
          <label>Select Display
            <select id="displaySelector"></select>
          </label>
          <label>Add Display ID
            <input id="newDisplayId" type="text" placeholder="gym-lobby" />
          </label>
          <button id="addDisplay" type="button">Add Display</button>
          <button id="deleteDisplay" type="button">Delete Display</button>
        </div>
        <div class="row">
          <label>Share Playlist Source
            <select id="shareSourceDisplay"></select>
          </label>
          <label>Share Playlist Target
            <select id="shareTargetDisplay"></select>
          </label>
          <button id="sharePlaylist" type="button">Share Playlist With Another Display</button>
        </div>
        <div id="displayUrls" class="mono"></div>
      </section>

      <section>
        <h2>Tier Manager</h2>
        <p class="mono">Tier 0 is locked as Emergency Tier. Drag tiers to reorder remaining priorities.</p>
        <ul id="tierList" class="mono"></ul>
        <div class="row">
          <label>Add Tier
            <input id="newTierValue" type="number" min="1" step="1" placeholder="6" />
          </label>
          <button id="addTier" type="button">Add Tier</button>
        </div>
      </section>

      <section>
        <h2>Per-Page Controls</h2>
        <label><input id="showDeletedPages" type="checkbox" /> Show Deleted Pages</label>
        <div id="pageSettingsCards" class="page-grid"></div>
      </section>

      <section>
        <h2>Add Page</h2>
        <label>Page Name <input id="newPageName" type="text" /></label>
        <label>
          Page Type
          <select id="newPageType">
            <option value="url">url</option>
            <option value="inline-code">inline-code</option>
            <option value="time">time</option>
            <option value="weather">weather</option>
            <option value="custom">custom</option>
          </select>
        </label>
        <label>URL <input id="newPageUrl" type="url" placeholder="https://example.com/page" /></label>
        <label>Inline Code (HTML)
          <textarea id="newPageCode" rows="8" class="mono" placeholder="<section><h1>Custom Page</h1></section>"></textarea>
        </label>
        <button id="savePage" type="button">Save Page</button>
      </section>

      <section>
        <h2>Trigger-Aware Preview</h2>
        <div id="rotationPreviewCard" class="preview-card mono">loading...</div>
      </section>

      <section>
        <h2>Actions</h2>
        <button id="refreshSettings" type="button">Refresh</button>
        <button id="downloadSettings" type="button">Download Settings</button>
        <button id="backupPages" type="button">Backup Pages</button>
        <input id="restoreSettingsFile" type="file" accept="application/json" />
        <button id="restoreSettings" type="button">Restore Settings</button>
      </section>

      <section>
        <h2>Status</h2>
        <pre id="status" class="mono"></pre>
      </section>
    </main>
    <script type="module" src="./scripts/rotation-preview.js"></script>
    <script type="module" src="./scripts/orchestrator-settings.js"></script>
  </body>
</html>
